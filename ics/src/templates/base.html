<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site_name }}</title>
    <link rel="stylesheet" href="{{ js9_asset_base }}/js9-allinone.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/js9-dark.css') }}">
  </head>
  <body class="ics-dark">
    <header class="topbar">
      <div>
        <h1>{{ site_name }}</h1>
        <p>Instrument Control Software</p>
      </div>
      <div class="topbar-actions">
        <button data-action="connect">Connect all</button>
        <button data-action="disconnect">Disconnect</button>
      </div>
    </header>
    <section id="action-error" class="action-error hidden" role="alert" aria-live="assertive">
      <div>
        <div class="action-error-kicker" id="action-error-status">Request failed</div>
        <h2 id="action-error-title">Instrument command failed</h2>
        <p id="action-error-message"></p>
        <dl id="action-error-details"></dl>
      </div>
      <button type="button" class="secondary" data-action="dismiss-error">Dismiss</button>
    </section>
    <main>
      {% block content %}{% endblock %}
    </main>
    <script
      src="{{ js9_asset_base }}/js9-allinone.js"
      onerror="window.__js9LoadError = true"
    ></script>
    <script src="{{ url_for('static', filename='js/app.js', v='20260804-js9-refresh-object') }}"></script>
  </body>
</html>
